name: Deploy promo site to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node (for JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate events index
        run: |
          python tools/promogen.py build

      - name: Run site sanity checks
        env:
          GRACE_DAYS: "2"
          MAX_LINKS: "60"
          LINK_TIMEOUT_SEC: "6"
          STRICT_LINKS: "0"
        run: |
          python tools/check_site.py

      - name: Prepare site folder
        run: |
          mkdir -p site
          cp index.html site/
          cp -R events site/events
          touch site/.nojekyll

      # ✅ PR preview artifact (downloadable) — lets you view site before merge
      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: promo-site-preview
          path: site
          retention-days: 7

      # ✅ Pages deploy artifacts only for main pushes
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
