<!doctype html>
<html lang="he" dir="rtl">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R3ZYXHRQFC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-R3ZYXHRQFC');
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>עדכונים הפקות שטילר & רון</title>
  <meta name="description" content="אירועים שאנחנו מקדמים – קישורים, קופונים ." />

  <style>
    :root{
      --bg:#070711;
      --card:#111124;
      --muted:#b8b8c9;
      --text:#f4f4f7;
      --line:rgba(255,255,255,.10);
      --line2:rgba(255,255,255,.14);
      --btn:#1a1a2e;
      --btn2:#ffffff;
      --btn2text:#000000;
      --accent:#ff2d55;
      --good:#00ffb4;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; font-family: system-ui, -apple-system, Segoe UI, Arial;
      background:
        radial-gradient(1200px 700px at 50% -200px, rgba(255,45,85,.25), transparent 60%),
        radial-gradient(900px 600px at 0% 0%, rgba(0,255,180,.10), transparent 55%),
        var(--bg);
      color:var(--text);
    }
    a{ color:inherit; }
    header{
      position:sticky; top:0; z-index:20;
      background: rgba(7,7,17,.86);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .wrap{ max-width: 1040px; margin:0 auto; padding: 14px 16px; }
    .top{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .brand{ display:flex; align-items:center; gap:10px; }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: var(--accent);
      box-shadow: 0 0 22px rgba(255,45,85,.55);
    }
    h1{ margin:0; font-size: 16px; letter-spacing:.2px; }
    .sub{ margin:0; font-size:12px; color:var(--muted); }

    .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input, select{
      background: rgba(17,17,36,.92);
      border:1px solid var(--line2);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      outline: none;
    }
    input{ min-width: 220px; }

    main{ padding: 14px 16px 24px; }
    .section{ max-width: 1040px; margin: 0 auto; }
    .sectionHead{
      display:flex; align-items: baseline; justify-content:space-between;
      gap:12px; flex-wrap:wrap;
      margin: 18px 0 10px;
    }
    .sectionHead h2{
      margin:0; font-size: 14px; letter-spacing:.2px;
      color: var(--text);
    }
    .hint{ margin:0; font-size:12px; color:var(--muted); }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .card{
      background: linear-gradient(180deg, rgba(17,17,36,.92), rgba(12,12,26,.92));
      border:1px solid var(--line);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
      position:relative;
    }

    .imgWrap{
      width:100%;
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.06);
    }
    .imgWrap::before{
      content:"";
      position:absolute;
      inset:-24px;
      background-image: var(--bgimg);
      background-size: cover;
      background-position: center;
      filter: blur(18px) saturate(1.15);
      transform: scale(1.08);
      opacity: .55;
    }
    .imgInner{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: contain;
      object-position: center;
      display:block;
    }

    .content{ padding: 12px 12px 14px; display:flex; flex-direction:column; gap:8px; }
    .title{ font-size: 16px; font-weight: 850; line-height:1.2; }
    .meta{
      display:flex; gap: 10px; flex-wrap:wrap;
      font-size: 12.5px; color: var(--muted);
    }
    .desc{ font-size: 13px; line-height:1.35; color: rgba(244,244,247,.92); }
    .pillRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .pill{
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      width: fit-content;
      color: var(--text);
      background: rgba(0,0,0,.12);
    }
    .pill.soon{ border-color: rgba(0,255,180,.35); box-shadow: 0 0 0 1px rgba(0,255,180,.08) inset; }
    .pill.past{ opacity: .75; }
    .pill.now{
      border-color: rgba(255,45,85,.55);
      box-shadow: 0 0 0 1px rgba(255,45,85,.18) inset;
    }

    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 4px; }
    .btn{
      text-decoration:none;
      background: rgba(26,26,46,.92);
      border:1px solid var(--line2);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 13px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      user-select:none;
    }
    .btn.primary{
      background: var(--btn2);
      color: var(--btn2text);
      border-color: rgba(255,255,255,.35);
    }
    .btn.ghost{ background: transparent; }
    .btn:active{ transform: translateY(1px); }

    .empty{
      opacity:.85;
      padding: 22px 10px;
      text-align:center;
      border:1px dashed rgba(255,255,255,.18);
      border-radius: 16px;
      margin-top: 12px;
      color: var(--muted);
    }
    .toggleRow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .count{
      font-size: 12px; color: var(--muted);
      border:1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(0,0,0,.12);
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.75);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body>
<header>
  <div class="wrap top">
    <div class="brand">
      <div class="dot"></div>
      <div>
        <h1>קהילת עדכונים הפקות שטילר & רון</h1>
        <p class="sub">אירועים שאנחנו מקדמים</p>
      </div>
    </div>

    <div class="controls">
      <input id="q" placeholder="חיפוש… (שם/מקום)" />
      <select id="sort">
        <option value="asc">מיון קרובים: מהקרוב לרחוק</option>
        <option value="desc">מיון קרובים: מהרחוק לקרוב</option>
      </select>
      <select id="pastSort">
        <option value="newest">עבר: הכי חדש למעלה</option>
        <option value="oldest">עבר: הכי ישן למעלה</option>
      </select>

      <a class="btn ghost"
         href="https://chat.whatsapp.com/J8ntxdUO1hWAPfgK5m7lSQ"
         target="_blank" rel="noopener"
         data-join="1">
        👥 להצטרפות לקהילה
      </a>
    </div>
  </div>
</header>

<main>
  <section class="section">
    <div class="sectionHead">
      <div>
        <h2>אירועים קרובים</h2>
      </div>
      <div class="toggleRow">
        <span class="count" id="upcomingCount">—</span>
      </div>
    </div>

    <div id="upcomingGrid" class="grid"></div>
    <div id="upcomingEmpty" class="empty" style="display:none;">אין כרגע אירועים קרובים לפי החיפוש.</div>
  </section>

  <section class="section">
    <div class="sectionHead">
      <div>
        <h2>Past events</h2>
        <p class="hint">ארכיון.</p>
      </div>
      <div class="toggleRow">
        <span class="count" id="pastCount">—</span>
        <button class="btn" id="togglePast">הצג</button>
      </div>
    </div>

    <div id="pastWrap" style="display:none;">
      <div id="pastGrid" class="grid"></div>
      <div id="pastEmpty" class="empty" style="display:none;">אין אירועים שעברו לפי החיפוש.</div>
    </div>
  </section>
</main>

<div id="toast" class="toast">✅ הועתק</div>

<script>
  const upcomingGrid = document.getElementById('upcomingGrid');
  const pastGrid = document.getElementById('pastGrid');
  const upcomingEmpty = document.getElementById('upcomingEmpty');
  const pastEmpty = document.getElementById('pastEmpty');
  const pastWrap = document.getElementById('pastWrap');

  const qEl = document.getElementById('q');
  const sortEl = document.getElementById('sort');
  const pastSortEl = document.getElementById('pastSort');

  const upcomingCount = document.getElementById('upcomingCount');
  const pastCount = document.getElementById('pastCount');
  const togglePastBtn = document.getElementById('togglePast');

  const toastEl = document.getElementById('toast');
  let toastTimer = null;

  // holds folder -> { folder, meta, dt }
  const EVENT_MAP = new Map();

  // ---------- UI helpers ----------
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1200);
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[m]));
  }

  function parseLocalDate(dateStr, timeStr) {
    const t = (timeStr && String(timeStr).includes(':')) ? String(timeStr) : '00:00';
    return new Date(`${dateStr}T${t}:00`);
  }

  function fmtDate(d) {
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    return `${dd}.${mm}.${yyyy}`;
  }

  function daysDiff(a, b) {
    const ms = 24 * 60 * 60 * 1000;
    return Math.floor((a - b) / ms);
  }

  function startOfDay(d){
    const x = new Date(d);
    x.setHours(0,0,0,0);
    return x;
  }
  function isSameDay(a,b){
    return a.getFullYear()===b.getFullYear()
        && a.getMonth()===b.getMonth()
        && a.getDate()===b.getDate();
  }
  function isTomorrow(dt, now){
    const t = startOfDay(now);
    t.setDate(t.getDate()+1);
    return isSameDay(dt, t);
  }

  // ---------- "NOW" window: until 07:00 next day ----------
  function eventNowWindowEnd(startDt){
    const end = new Date(startDt);
    if (startDt.getHours() < 7) {
      end.setHours(7,0,0,0);
    } else {
      end.setDate(end.getDate() + 1);
      end.setHours(7,0,0,0);
    }
    return end;
  }

  function getEventStatus(dtStart, now){
    const endNow = eventNowWindowEnd(dtStart);
    const isNow = now >= dtStart && now < endNow;
    const isPast = now >= endNow;
    return { isNow, isPast, endNow };
  }

  // ---------- GA helpers (FIXED PARAMS) ----------
  function gaEvent(name, params){
    try { if (typeof gtag === "function") gtag("event", name, params || {}); } catch {}
  }

  // ✅ תמיד שולחים גם event_folder_t וגם event_title_tix כדי שלא יהיה (not set)
function trackTicketClick(folder, e){
  gaEvent("ticket_click", {
    event_folder: folder,
    event_title: e?.title || "",
    event_date: e?.date || "",
    event_location: e?.location || "",
    link_url: e?.ticket_url || ""
  });
}

  function trackCouponCopy(folder, e, coupon){
gaEvent("copy_coupon", {
  event_folder: folder,
  event_title: item?.meta?.title || "",
  coupon_code: code
});

  function trackJoinCommunity(){
    gaEvent("join_community_click", {
      link_url: "https://chat.whatsapp.com/J8ntxdUO1hWAPfgK5m7lSQ"
    });
  }

  // ---------- ICS (Add to Calendar) ----------
  function pad2(n){ return String(n).padStart(2,'0'); }
  function icsDateLocal(d){
    return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
  }
  function icsEscape(s){
    return String(s ?? '')
      .replace(/\\/g, '\\\\')
      .replace(/\n/g, '\\n')
      .replace(/,/g, '\\,')
      .replace(/;/g, '\\;');
  }
  function buildICS(folder, e){
    const tz = "Asia/Jerusalem";
    const dtStart = parseLocalDate(e.date, e.time);
    const dtEnd = new Date(dtStart.getTime() + 4 * 60 * 60 * 1000);

    const title = e.title || "Event";
    const location = e.location || "";
    const url = e.ticket_url || "";
    const coupon = e.coupon_code ? `Coupon: ${e.coupon_code}` : "";
    const descriptionParts = [
      e.description || "",
      coupon,
      url ? `Tickets: ${url}` : ""
    ].filter(Boolean);
    const description = descriptionParts.join("\\n\\n");

    const uid = `${folder}@promo-site`;
    const now = new Date();

    return [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//promo-site//events//HE",
      "CALSCALE:GREGORIAN",
      "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      `UID:${icsEscape(uid)}`,
      `DTSTAMP:${icsDateLocal(now)}`,
      `DTSTART;TZID=${tz}:${icsDateLocal(dtStart)}`,
      `DTEND;TZID=${tz}:${icsDateLocal(dtEnd)}`,
      `SUMMARY:${icsEscape(title)}`,
      location ? `LOCATION:${icsEscape(location)}` : "",
      description ? `DESCRIPTION:${icsEscape(description)}` : "",
      url ? `URL:${icsEscape(url)}` : "",
      "END:VEVENT",
      "END:VCALENDAR"
    ].filter(Boolean).join("\r\n");
  }

  function downloadICS(folder){
    const item = EVENT_MAP.get(folder);
    if (!item) return;

    const ics = buildICS(folder, item.meta);
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `${folder}.ics`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1200);

    showToast("📅 הקובץ ירד ליומן");
gaEvent("add_to_calendar", {
  event_folder: folder,
  event_title: item?.meta?.title || ""
});
  }

  // ---------- card ----------
  function card(e, folder, status) {
    const dt = parseLocalDate(e.date, e.time);
    const now = new Date();
    const diff = daysDiff(dt, now);

    let pillText = 'בקרוב';
    let pillClass = 'soon';

    if (status.isNow) { pillText = 'עכשיו'; pillClass = 'now'; }
    else if (status.isPast) { pillText = 'הסתיים'; pillClass = 'past'; }
    else if (isSameDay(dt, now)) { pillText = 'היום'; pillClass = 'now'; }
    else if (isTomorrow(dt, now)) { pillText = 'מחר'; pillClass = 'soon'; }
    else { pillText = (diff <= 7 ? 'בשבוע הקרוב' : 'בקרוב'); pillClass = 'soon'; }

    const imagePath = e.image ? `events/${folder}/${e.image}` : '';

    const couponBtn = e.coupon_code ? `
      <button class="btn copy-btn"
              data-copy="${esc(e.coupon_code)}"
              data-folder="${esc(folder)}">🎟️ העתק קופון</button>
    ` : '';

    const ticketsBtn = (e.ticket_url) ? `
      <a class="btn primary"
         href="${esc(e.ticket_url)}"
         target="_blank" rel="noopener"
         data-ticket="1"
         data-folder="${esc(folder)}">
         ${status.isPast ? 'לינק לאירוע' : 'כרטיסים'}
      </a>
    ` : '';

    const calendarBtn = !status.isPast ? `
      <button class="btn ics-btn" data-folder="${esc(folder)}">📅 הוסף ליומן</button>
    ` : '';

    const promoterBtn = e.promoter_url ? `
      <a class="btn" href="${esc(e.promoter_url)}" target="_blank" rel="noopener">הקישור שלי</a>
    ` : '';

    const whenLine = `
      <span>📅 ${fmtDate(dt)}</span>
      ${e.time ? `<span>🕒 ${esc(e.time)}</span>` : ''}
      ${e.location ? `<span>📍 ${esc(e.location)}</span>` : ''}
    `;

    const imageHtml = imagePath ? `
      <div class="imgWrap" style="--bgimg:url('${esc(imagePath)}')">
        <img class="imgInner" src="${esc(imagePath)}" alt="${esc(e.title || 'event')}">
      </div>
    ` : '';

    return `
      <div class="card">
        ${imageHtml}
        <div class="content">
          <div class="pillRow">
            <div class="pill ${pillClass}">${pillText}</div>
          </div>
          <div class="title">${esc(e.title || 'אירוע')}</div>
          <div class="meta">${whenLine}</div>
          ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ''}
          <div class="actions">
            ${ticketsBtn}
            ${couponBtn}
            ${calendarBtn}
            ${promoterBtn}
          </div>
        </div>
      </div>
    `;
  }

  // ✅ IMPORTANT: no more wireButtons per render (prevents duplicates)
  // We handle clicks globally with event delegation below.

  // ---------- GLOBAL CLICK HANDLER (FIXES "works only in console") ----------
  document.addEventListener('click', async (ev) => {
    // copy coupon
    const copyBtn = ev.target.closest('[data-copy]');
    if (copyBtn) {
      const code = copyBtn.getAttribute('data-copy') || '';
      const folder = copyBtn.getAttribute('data-folder') || '';
      const item = EVENT_MAP.get(folder);

      // send GA always (no "not set")
      trackCouponCopy(folder, item?.meta || {}, code);

      try {
        await navigator.clipboard.writeText(code);
        showToast('✅ קופון הועתק');
      } catch (e) {
        // still counted in GA above
        alert('לא הצלחתי להעתיק אוטומטית. הקוד: ' + code);
      }
      return;
    }

    // add to calendar
    const icsBtn = ev.target.closest('.ics-btn');
    if (icsBtn) {
      const folder = icsBtn.getAttribute('data-folder') || '';
      downloadICS(folder);
      return;
    }

    // ticket click
    const ticketA = ev.target.closest('[data-ticket="1"]');
    if (ticketA) {
      const folder = ticketA.getAttribute('data-folder') || '';
      const item = EVENT_MAP.get(folder);
      trackTicketClick(folder, item?.meta || {});
      return;
    }

    // join community
    const joinA = ev.target.closest('[data-join="1"]');
    if (joinA) {
      trackJoinCommunity();
      return;
    }
  });

  async function fetchJson(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
    return await res.json();
  }

  function applySearch(items) {
    const q = qEl.value.trim().toLowerCase();
    if (!q) return items;
    return items.filter(x => {
      const e = x.meta;
      return (e.title || '').toLowerCase().includes(q)
          || (e.location || '').toLowerCase().includes(q);
    });
  }

  function render(all) {
    const now = new Date();
    const items = applySearch(all);

    const nowItems = [];
    const upcoming = [];
    const past = [];

    for (const x of items) {
      const st = getEventStatus(x.dt, now);
      x.status = st;
      if (st.isNow) nowItems.push(x);
      else if (st.isPast) past.push(x);
      else upcoming.push(x);
    }

    nowItems.sort((a,b) => a.dt - b.dt);

    const s = sortEl.value;
    upcoming.sort((a,b) => s === 'asc' ? (a.dt - b.dt) : (b.dt - a.dt));

    const ps = pastSortEl.value;
    past.sort((a,b) => ps === 'newest' ? (b.dt - a.dt) : (a.dt - b.dt));

    upcomingGrid.innerHTML = [...nowItems, ...upcoming].map(x => card(x.meta, x.folder, x.status)).join('');
    pastGrid.innerHTML = past.map(x => card(x.meta, x.folder, x.status)).join('');

    upcomingEmpty.style.display = (nowItems.length || upcoming.length) ? 'none' : 'block';
    pastEmpty.style.display = past.length ? 'none' : 'block';

    upcomingCount.textContent = `${nowItems.length ? `🔥 ${nowItems.length} עכשיו • ` : ''}${(nowItems.length + upcoming.length)} אירועים`;
    pastCount.textContent = `${past.length} אירועים`;
  }

  async function init() {
    const folders = await fetchJson('events/index.json');

    const all = [];
    EVENT_MAP.clear();

    for (const folder of folders) {
      try {
        const meta = await fetchJson(`events/${folder}/meta.json`);
        const dt = parseLocalDate(meta.date, meta.time);
        const item = { folder, meta, dt, status: null };
        all.push(item);
        EVENT_MAP.set(folder, item);
      } catch (e) {
        console.warn('Failed loading event:', folder, e);
      }
    }

    const rerender = () => render(all);
    qEl.addEventListener('input', rerender);
    sortEl.addEventListener('change', rerender);
    pastSortEl.addEventListener('change', rerender);

    togglePastBtn.addEventListener('click', () => {
      const open = pastWrap.style.display !== 'none';
      pastWrap.style.display = open ? 'none' : 'block';
      togglePastBtn.textContent = open ? 'הצג' : 'הסתר';
    });

    rerender();
  }

  init().catch(err => {
    console.error(err);
    upcomingEmpty.style.display = 'block';
    upcomingEmpty.textContent = 'שגיאה בטעינת events/index.json / meta.json. בדוק שהקבצים קיימים ותקינים.';
  });
</script>
</body>
</html>
